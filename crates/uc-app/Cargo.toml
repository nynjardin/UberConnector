[package]
name = "uc-app"
version.workspace = true
edition = "2024"

[[bin]]
name = "UberConnector"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros"] }
anyhow = "1"
hex = "0.4"
rand = "0.10"
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# Same version as WebView2's: toasts (WinRT) without a new dependency.
windows = { version = "0.62", features = ["UI_Notifications", "Data_Xml_Dom", "Foundation"] }
uc-core = { path = "../uc-core" }
base64 = "0.23.1"
ureq = { version = "3.5.0", features = ["json"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
sha2 = "0.11.1"

[features]
# Serve the embedded `ui/` folder (no dev server); required for builds made with plain cargo.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
