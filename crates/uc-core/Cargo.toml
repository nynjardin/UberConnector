[package]
name = "uc-core"
version.workspace = true
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chacha20poly1305 = "0.11.0"
curve25519-dalek = "5"
ed25519-dalek = "3"
futures = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
if-addrs = "0.15.0"
mainline = "8"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell"] }
winreg = "0.56"
# Nostr rendezvous (see `nostr`): relay websockets and event signatures.
k256 = { version = "0.13", features = ["schnorr"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
igd-next = { version = "0.18.0", default-features = false, features = ["aio_tokio"] }
